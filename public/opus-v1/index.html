<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Machida Shoten Cambodia — Free Angkor Draft</title>
<meta name="description" content="Show this screen at Machida Shoten Cambodia and get one free glass of Angkor Draft.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%23d7132a'/%3E%3Crect x='6' y='6' width='20' height='20' rx='2' fill='none' stroke='%23fff' stroke-width='2'/%3E%3C/svg%3E">
<meta name="theme-color" content="#0a0708">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&display=swap" rel="stylesheet">
<link rel="preload" as="image" href="assets/img/hero-bowl.webp" imagesrcset="assets/img/hero-bowl-sm.webp 620w, assets/img/hero-bowl.webp 1100w" imagesizes="100vw">
<link rel="stylesheet" href="assets/css/base.css?v=3">
<link rel="stylesheet" href="assets/css/page1.css?v=3">

</head>
<body class="p1">

<div class="stage">

  <div class="bg" aria-hidden="true">
    <div class="bg__glow"></div>
    <img class="bg__bowl" src="assets/img/hero-bowl.webp"
         srcset="assets/img/hero-bowl-sm.webp 620w, assets/img/hero-bowl.webp 1100w"
         sizes="100vw" width="1100" height="1261" alt="" fetchpriority="high" decoding="async">
    <div class="bg__scrim"></div>
    <div class="bg__grain"></div>
    <div class="embers">
      <i style="--x:12%;--d:0s;--t:9s;--s:.7"></i><i style="--x:26%;--d:1.4s;--t:11s;--s:1"></i>
      <i style="--x:41%;--d:3.1s;--t:8.5s;--s:.6"></i><i style="--x:58%;--d:.7s;--t:10.5s;--s:.9"></i>
      <i style="--x:71%;--d:4.2s;--t:9.5s;--s:.75"></i><i style="--x:86%;--d:2.3s;--t:12s;--s:1.1"></i>
      <i style="--x:94%;--d:5.6s;--t:10s;--s:.6"></i><i style="--x:34%;--d:6.4s;--t:11.5s;--s:.85"></i>
    </div>
  </div>

  <header class="bar">
    <img class="bar__logo" src="assets/img/logo-lockup.svg" alt="Machida Shoten — Japanese Ramen" width="980" height="152">
  </header>

  <main class="offer">
    <a class="exit exit--inline" href="https://machida-shoten-cambodia.netlify.app/" target="_blank" rel="noopener">
      Menu &amp; Location <span aria-hidden="true">↗</span>
    </a>

    <p class="offer__eyebrow"><span>Exclusive QR Offer</span></p>

    <h1 class="offer__head">
      <span class="rv"><span>Free</span></span>
      <span class="rv"><span>Angkor</span></span>
      <span class="rv"><span>Draft</span></span>
      <span class="sweep" aria-hidden="true"></span>
    </h1>

    <p class="offer__bar"><span>1 glass on us.</span></p>

    <p class="offer__note">Show this screen at Machida&nbsp;Shoten Cambodia.</p>

    <a class="cta" href="iekei.html" data-nav>
      What is Yokohama Style Ramen? <span class="cta__arrow" aria-hidden="true">→</span>
    </a>

    <p class="offer__fine">Campaign details to be confirmed.</p>
  </main>

</div>

<section class="mystery-box-overlay" id="mysteryBoxOverlay" role="dialog" aria-labelledby="mysteryBoxTitle" aria-describedby="mysteryBoxSub" aria-modal="true">
  <div class="mystery-box__atmosphere" aria-hidden="true">
    <span class="mystery-box__halo"></span>
    <span class="mystery-box__sweep"></span>
    <div class="mystery-box__particles">
      <i style="--x:15%;--y:28%;--d:.1s;--s:.7"></i><i style="--x:82%;--y:22%;--d:.35s;--s:1"></i>
      <i style="--x:9%;--y:65%;--d:.7s;--s:.6"></i><i style="--x:90%;--y:61%;--d:.2s;--s:.8"></i>
      <i style="--x:25%;--y:78%;--d:.55s;--s:.55"></i><i style="--x:74%;--y:76%;--d:.85s;--s:.75"></i>
    </div>
  </div>

  <div class="mystery-box__content">
    <p class="mystery-box__kicker">Exclusive QR</p>
    <img class="mystery-box__logo" src="assets/img/logo-lockup.svg" width="980" height="152" alt="Machida Shoten — Japanese Ramen">

    <div class="mystery-box__art" aria-hidden="true">
      <span class="mystery-box__flash"></span>
      <span class="mystery-box__rays"></span>
      <span class="mystery-box__asset-frame">
        <img class="mystery-box__asset" src="assets/img/mystery-box.svg" width="668" height="692" alt="" decoding="async">
      </span>
    </div>

    <div class="mystery-box__copy">
      <h1 id="mysteryBoxTitle">Machida Mystery Box</h1>
      <p id="mysteryBoxSub">Scan. Slide. Reveal.</p>
    </div>

    <div class="mystery-slider" id="mysterySlider" role="slider" tabindex="0" aria-label="Slide to open" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0 percent. Slide right to open.">
      <span class="mystery-slider__track">
        <span class="mystery-slider__fill"></span>
        <span class="mystery-slider__label">Slide to Open</span>
        <span class="mystery-slider__thumb" aria-hidden="true"><span>→</span></span>
      </span>
    </div>
    <p class="mystery-box__hint">Slide right to open</p>
  </div>
</section>

<audio id="boxOpenSound" preload="auto" aria-hidden="true" src="assets/audio/box-open.wav"></audio>
<audio id="rewardSound" preload="auto" aria-hidden="true" src="assets/audio/reward-chime.mp3"></audio>
<div class="wipe" aria-hidden="true"></div>
<script src="assets/js/nav.js?v=2" defer></script>
<script src="assets/js/mystery-box.js?v=3" defer></script>
</body>
</html>
